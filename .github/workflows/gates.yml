name: 门禁

# 全套门禁的**唯一定义**。ci.yml 与 release.yml 各自 `uses:` 这一个文件。
#
# 为什么不把清单抄两份：抄第二份的那一天，就是两份开始分岔的那一天，而分岔
# 只会往「少一道门」的方向积累——多的那一份没人执行，也没人会去比对差集
# （LESSONS.md 第 29 条，那条正是 `AGENTS.md` 与 `ci.yml` 之间栽过的）。
#
# 这里曾经只在 ci.yml 里，于是 release.yml 自称「发布前的最后一道门」，实际
# 只重跑了 `go test` 与集成测试门禁：`gofmt`、`go vet`、`golangci-lint`、
# 分层自查、红线扫描、三道死代码门、函数名门禁、索引一致性门禁、契约测试
# **一道都没跑**。它比常规 CI 弱，而它是唯一挡在发布前面的一道。
#
# 抽成可复用工作流之后，「有哪些门」只有这一处；`release.yml` 里那句
# 「tag 可能打在没跑过 CI 的 commit 上」对**每一道门**都成立，于是每道门
# 都跟着一起重跑，不必逐个记得补。
#
# 契约 job 也在这里，所以发布路径上也会跑它。它不是「顺手带上」：
# 发布出去的二进制就是那个对外 API，契约测试验的正是对外响应的形状
# （必填字段、`finish_reason` 的取值集合、流式事件的顺序与终止条件、
# 错误体的 `error.type`），而发布是外部契约最要紧的时刻。代价是发布路径
# 多两个运行期依赖（Python 3.12 与两个官方 SDK），一次 `pip` 抖动就会挡住
# 发布——但那是重跑一次的事，而漏跑契约测试是「发出去的版本客户端一接就崩」。
# 它是独立 job，与其余几个并行，所以几乎不增加墙钟时间。
on:
  workflow_call:

# 每个 job 都只需要读仓库。调用方（release.yml）持有 `contents: write`
# 是为了创建 release，这里的门禁不该跟着拿到写权限——被调用工作流声明的
# 权限只能维持或收窄，不会反过来抬高调用方。
permissions:
  contents: read

jobs:
  go:
    name: Go
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: placeholder
          POSTGRES_DB: larkax_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      # 限流的计数落在 Redis 上，所以这个 job 里它是一份**必需品**而不是可选件：
      # 缺了它，那几个集成用例会 t.Skip，而「跳过」在输出里与「通过」长得一样
      # （见 LESSONS.md 第 16 条）。要它的理由与 postgres 逐字相同，所以两道都在
      # 这里、由 .github/actions/check-integration-tests 判「真的跑了」。
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      LARKAX_DB_DSN: postgres://postgres:placeholder@localhost:5432/larkax_test?sslmode=disable
      LARKAX_REDIS_DSN: redis://localhost:6379/0
      LARKAX_ROLE: worker
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: 格式检查
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "以下文件未格式化，请运行 gofmt -w："
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      # 与 gofmt/vet 分工：那两者快且零配置，这里放它们覆盖不到的、
      # 需要跨文件或深入语义的检查。
      #
      # 版本有两个坑，都实际撞过：
      #   1. 用比 go.mod 更旧的 Go 构建的 golangci-lint 会**直接拒绝运行**，
      #      报 "Go language version ... is lower than the targeted Go version"。
      #      所以要用本仓库的 toolchain 现构（install-mode: goinstall）。
      #   2. 它自带的 typechecker 也要够新。v2.5 读不懂 go1.26 的导出数据格式，
      #      报 "export data version 4 is greater than maximum supported
      #      version 2"——那个错看起来像代码问题，其实是工具版本问题。
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.14.0
          install-mode: goinstall

      # 「新代码没有门」的门禁：从两个 main 包出发跑 deadcode，与签入仓库的
      # 白名单（scripts/deadcode-allowlist.txt）比对。库写完了、测绿了，而
      # 「谁来调它」这件事没有任何一步会失败——`go build`、`go vet`、测试、
      # 覆盖率都不报，于是「有门」与「没门」在 CI 里长得一样。这一道让它失败。
      #
      # 版本必须钉住，且要与 scripts/check-deadcode.sh 里的 PINNED_TOOLS_VERSION
      # 一致：deadcode 的输出随 golang.org/x/tools 的版本变化，工具一升级基线
      # 就不可比（与 gremlins 那次同一个坑）。对不上时脚本会拒绝运行，不会
      # 跑出一批看起来像「新增」的结果。
      #
      # go install 装到 $(go env GOPATH)/bin，那个目录默认不在 PATH 里。
      - name: 安装 deadcode
        run: |
          go install golang.org/x/tools/cmd/deadcode@v0.52.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: 不可达符号门禁
        run: bash scripts/check-deadcode.sh

      # 这道门的判据全是集合比对，坏掉时（一个都没解析出来）的输出和
      # 「全部命中白名单」一模一样。所以自测不是可选的（LESSONS 第 2、16 条）。
      - name: 不可达符号门禁自测
        run: bash scripts/check-deadcode.test.sh

      # 上面那道门的补集。deadcode 只分析**从入口可达的那些包**，一个全仓库
      # 没有任何 import 方的包**整包不在它的分析范围里**——它的不可达清单是空的，
      # 而「空」与「全部可达」在输出里长得一模一样。所以「整包没人接」恰恰是
      # 那道门唯一系统性漏掉的一类，也是「没有门」最严重的一种。
      #
      # 这道门把「仓库自己的包」（go list ./...）与「从入口可达的包」
      #（go list -deps <cmd/ 下自动发现的 main 包>）两个集合相减，差集就是
      # 整包没人 import 的那些，同样走白名单
      #（scripts/unimported-allowlist.txt）：新出现的失败，已经接上的只提示。
      # 只依赖 go，不需要额外装工具。
      - name: 整包没人 import 门禁
        run: bash scripts/check-unimported.sh

      # 与上面那道门同理：它的判据全是集合比对，坏掉时（可达集合为空、
      # 仓库包列表为空）的输出和「通过」一模一样。所以自测不是可选的。
      - name: 整包没人 import 门禁自测
        run: bash scripts/check-unimported.test.sh

      # 前两道门都看不见的一类：**导出方法有没有调用点**。
      # deadcode 底下的 RTA 会把「任何 runtime type 的导出方法」整体当成可达
      # （反射可能调到），于是这一整类都在它的盲区里，而且掩蔽还会沿调用链传下去
      # ——一个被掩蔽的方法如果是某个自由函数唯一的调用方，那个函数也一起消失。
      # 本仓不用反射，所以这一类必须单独有一道门（scripts/check-deadmethods.sh，
      # 只依赖 go，白名单见 scripts/deadmethods-allowlist.txt）。
      - name: 导出方法调用点门禁
        run: |
          set +e
          out=$(bash scripts/check-deadmethods.sh 2>&1)
          rc=$?
          set -e
          printf '%s\n' "$out"

          # 这道门通过时是**沉默**的，而「什么都没输出」与「什么都没检查」长得一样。
          # 判据是它自己打出的正向证据：扫了几个文件、比了多少条。
          # 只看退出码不够——扫描范围变成零个包时它照样会走到「全部命中白名单」。
          if ! printf '%s\n' "$out" | grep -qE '^扫描器跑了 [1-9][0-9]* 个文件 / [1-9][0-9]* 个导出方法声明'; then
            echo "::error::这道门没有给出「扫了多少」的正向证据，不能当作通过。"
            exit 1
          fi
          if ! printf '%s\n' "$out" | grep -qE '^白名单 .* —— [1-9][0-9]* 条 / 上限 [0-9]+$'; then
            echo "::error::白名单一条都没读进来，比对的是半份清单。"
            exit 1
          fi

          if [ "$rc" -ne 0 ]; then
            exit "$rc"
          fi

      # 这道门的判据一半在脚本里、一半在脚本内嵌的那份 AST 扫描器里，
      # 而**两半坏掉时都不会响**：一个符号都扫不出来时屏幕上就是
      # 「全部命中白名单」。所以自测不是可选的（LESSONS 第 2、16、23 条）。
      - name: 导出方法调用点门禁自测
        run: bash scripts/check-deadmethods.test.sh

      # 先迁移再跑测试：把库推到已知状态，也让「迁移能应用」这件事
      # 在测试用到它之前就被验证过。
      - name: 迁移可应用且可回滚
        run: |
          go run ./cmd/larkaxctl migrate up
          go run ./cmd/larkaxctl migrate down
          go run ./cmd/larkaxctl migrate up

      # 补全行为用例要在真 shell 里跑：fish 走 `complete -C`，zsh 走替身
      # `compadd`。装壳失败时这一步当场红，别把判断留给用例——用例找不到壳
      # 只记一行日志，与「通过」在输出里长得一样（LESSONS.md 第 16 条）。
      - name: 装补全行为用例要用的壳
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y fish zsh
          fish --version
          zsh --version

      - name: 单元测试
        env:
          LARKAX_REQUIRE_COMPLETION_SHELLS: "1"
        run: go test -race -coverprofile=coverage.out ./...

      - name: 覆盖率摘要
        run: go tool cover -func=coverage.out | tail -1

      # man/ 下的手页与源文件同步。手页是产物：它由命令注册表
      # （cmd/larkaxctl 的 commandGroups）与 docs/cli-reference.md 生成，
      # 生成一次提交进库。产物与来源分家的样子是安静的——改了注册表里的一句话、
      # 改了文档的某一节却没重新生成，库里的手页仍然说着旧话，而 CI 里不会有
      # 任何一步失败，只有照着 `man larkaxctl-channel` 敲的人才会撞上。
      #
      # 形状照抄 cargo 的 validate-man.sh：重新生成一遍，与提交的那一份逐页
      # 比对，对不上就红。判据四条：生成器产出的每一页库里都有且逐字节相同；
      # 库里这一族（larkaxctl*.1）的每一页都是生成器产出的（删掉一条命令之后
      # 它那一页不该永远留着）；每一页非空且以 .TH 开头；手页里汉字与拉丁字母
      # 之间没有被吃掉的空格（那一格几乎总是接硬换行时丢的，判据在
      # internal/manpage 的 needsSpace）。
      #
      # 它的成功信号也是沉默，所以脚本每次都打印证据行（比对路径两行：逐页
      # 比对几次、紧贴扫出几处；`--update` 一行）。生成器非零退出、一页都没
      # 写出来、写出空页或没有 .TH 的页、剥完转义后还有不认识的 roff 转义时
      # 它判「没跑成」（退出码 2），不报通过。
      - name: 手页同步门禁
        run: bash scripts/check-man-pages.sh

      # 与其它扫描器同理：一个比对写反的同步门，输出与「同步」一模一样
      # （LESSONS.md 第 2、7、16 条）。它的自测还跑一遍真仓库（第 12 条），
      # 钉住脚本与生成器之间的约定（LARKAX_MAN_OUT、退出码、页数）真的接通了。
      - name: 手页同步门禁自测
        run: bash scripts/check-man-pages.test.sh

      # 「机器读的时刻恒 UTC」这道门。CI runner 默认 UTC，而库里 timestamptz
      # 经 pgx 交回来的 time.Time 带的是 time.Local——于是在一台本地恰好也是
      # UTC 的机器上，去掉某个时刻的 .UTC() 与留着它编出**同一个**字符串，
      # 这一步在结构上必然通过，就是个摆设。所以它自己把进程时区定成
      # Asia/Shanghai，把这类偏差变成一次必然的失败（TZ 生效时，去掉 .UTC()
      # 会当场变红；见 cmd/larkaxctl 的 TestJSONTimeIsUTCWhateverTheProcessZone
      # 与 gates 的这一步是一对）。
      #
      # **先证明这个时区真的生效了**：tzdata 缺失时 time.Local（与 `date +%z`）
      # 会静默回落成 UTC，而那时这一步会绿得毫无意义——「判据没跑成」与
      # 「通过」在输出里长得一样（见 LESSONS.md 第 16 条）。
      #
      # 取哪几个包：机器读输出里带时刻的那几个（见 docs/cli-output.md 的
      # 「时刻与时区」）——cmd/larkaxctl、internal/api、internal/plugin。
      - name: 非 UTC 时区下的时刻门禁
        env:
          TZ: Asia/Shanghai
        run: |
          offset=$(date +%z)
          echo "进程时区 = $TZ，UTC 偏移 = $offset"
          if [ "$offset" != "+0800" ]; then
            echo "::error::TZ=Asia/Shanghai 没有生效（date +%z = $offset）——多半是缺 tzdata，这样跑出来的绿是假的。"
            exit 1
          fi
          go test -count=1 ./cmd/larkaxctl/... ./internal/api/... ./internal/plugin/...

      # 集成测试在拿不到 DSN 时会**跳过**，而「跳过」在输出里和「通过」
      # 长得一样。这一步让「集成测试真的跑了」可被检查——
      # 否则 CI 会在一个从没跑过集成测试的状态下报绿。
      #
      # 检查本身在 .github/actions/check-integration-tests：发布路径调的是
      # 同一个工作流、也就调到了同一份实现，两边不会各自漂移。
      - uses: ./.github/actions/check-integration-tests

  # 前端（web/）：类型检查、单元测试、ESLint。
  #
  # 这三道检查原先只写在任务书里，靠实现者本机自觉跑——一个前端 PR 可以带着
  # `tsc` 报错、挂了用例或新增 lint 警告合入 main，而 CI 全绿。这与仓库里反复
  # 强调的那条同形：「跳过」与「通过」在输出里长得一样。
  #
  # 与 go job 分开，是因为它多一整套运行期依赖（Node 与 npm 装出来的
  # node_modules）；塞进 go job 会让「Go 测试挂了」与「npm 装不上」混在同一份
  # 日志里，而这两件事的处置不同。三道检查按下面的顺序跑：类型检查最先，
  # 它挂了之后的用例结果与 lint 结果都不必再看。
  web:
    name: Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      # Node 版本只写在仓库根的 `.nvmrc` 里，这里从那个文件读，不再另写一个数。
      # 两处各写一个数的那一天，就是它们开始分岔的那一天。
      #
      # 缓存键跟着 web/package-lock.json 走，不跟仓库根的路径：这个仓只有
      # 前端一处 lock，写死路径比 glob 更容易看出它指的是哪份文件。
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      # 用 ci 而不是 install：它按 lock 精确装，且 lock 与 package.json 对不上
      # 时直接失败。install 会悄悄改写 lock，于是「锁文件可用」这条判据就没了。
      - name: 安装依赖
        run: npm ci

      - name: 类型检查
        run: npx tsc -b

      # 判据不能只看退出码。默认 reporter 的汇总行（`Tests  N passed`）是
      # 「跑了多少」的唯一正面证据：汇总行不见了（reporter 换了、输出被截断），
      # 或者一条用例都没跑时，退出码说明不了用例跑过。所以这里自己取一次计数
      # 并打出来——「0 条跑过」与「全部通过」在日志里必须分得开。
      #
      # 跳过同样算没测（LESSONS.md 第 16 条）：`describe.skip` 写进去之后
      # 用例数照旧好看，而那几条什么都没验。
      - name: 单元测试
        env:
          # 汇总行要按文本读，颜色转义序列会让行首的空白匹配不上；那时一次
          # 全绿的运行也会被判成「没跑成」。下面的 sed 再兜一层，与这一行
          # 合起来是两道：任一道漏了，另一道仍然能让计数被读到。
          NO_COLOR: '1'
        run: |
          set +e
          out=$(npx vitest run 2>&1)
          rc=$?
          set -e
          printf '%s\n' "$out"

          clean=$(printf '%s\n' "$out" | sed -E 's/\x1b\[[0-9;]*[a-zA-Z]//g')
          summary=$(printf '%s\n' "$clean" | grep -E '^ +Tests +' | tail -1 || true)
          skipped=$(printf '%s\n' "$summary" | sed -nE 's/.*[^0-9]([0-9]+) skipped.*/\1/p')
          if [ -n "$skipped" ] && [ "$skipped" -ne 0 ]; then
            echo "::error::有 $skipped 个用例被跳过。跳过等于没测。"
            exit 1
          fi

          passed=$(printf '%s\n' "$summary" | sed -nE 's/.*[^0-9]([0-9]+) passed.*/\1/p')
          if [ -z "$passed" ]; then
            echo "::error::没读到用例计数（汇总行不在输出里，或者一条用例都没跑）。"
            echo "::error::「没跑成」与「全部通过」长得一样，所以这里不能只看退出码。"
            exit 1
          fi

          if [ "$rc" -ne 0 ]; then
            echo "::error::单元测试有失败用例。"
            exit "$rc"
          fi

          echo "web 单元测试跑了 $passed 个用例，全部通过。"

      # `--max-warnings 0`：警告留着不管，下一次「只加一条警告」就不会有人拦。
      # 这条命令此前在干净的 main 上就有 4 条 react-refresh 警告（ops/common.tsx
      # 同时导出组件与函数），那些已经通过拆文件清零；不留文件级豁免。
      - name: ESLint
        run: npx eslint src --max-warnings 0

  # 契约测试：用**官方 SDK** 当客户端跑一遍，两套协议各一遍。
  #
  # 与 go job 分开，是因为它多两个运行期依赖（Python 与两个官方 SDK）。
  # 塞进 go job 会让「Go 测试挂了」与「Python 依赖没装」混在同一份日志里，
  # 而这两件事的处置完全不同。
  #
  # 它验的是**我们对外响应的形状**——必填字段、可空字段是 null 还是省略、
  # finish_reason 的取值集合、流式事件的顺序与终止条件、错误体的 error.type。
  # 这几种错，仓库里的端到端用例全绿，而客户端一接就崩：那些用例用的是自己
  # 写的假上游与自己构造的请求，证明的只是「我们的响应我们自己能解析」。
  contract:
    name: 契约
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: placeholder
          POSTGRES_DB: larkax_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      LARKAX_DB_DSN: postgres://postgres:placeholder@localhost:5432/larkax_test?sslmode=disable
      LARKAX_ROLE: worker
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 版本钉在 contract/requirements.txt 里（`==`，不是 `>=`）。
      # 理由与 gremlins / deadcode 那两次一样：不钉版本的工具，它的结论不可比——
      # SDK 一个大版本升级会改响应形状的解析，那时「昨天绿今天红」说明不了任何事。
      - name: 安装契约测试依赖
        run: pip install -r contract/requirements.txt

      # 判据不能只看退出码。`-run` 匹配不到任何用例时 `go test` **照样退出 0**，
      # 输出里只有一行 "testing: warning: no tests to run"——那与「全跑过了」
      # 在退出码上长得一模一样（见 LESSONS.md 第 16 条）。
      #
      # 所以这里要一个**正向证据**：`--- PASS: TestContract...` 出现过几次。
      # 这与 .github/actions/check-integration-tests 那道门是同一个形状，
      # 只是它按包数、这里按用例数。
      # `go vet` 默认**不看** build tag 后面的文件，所以带 `contract` 标签的那一份
      # 在 `go` job 的 `go vet ./...` 里是看不见的——它要单独带 `-tags` 跑一遍
      # （docs/development.md 的「常用检查」一节写着这条命令）。放在契约测试**之前**：vet 挂了
      # 说明这一份根本没编译过，那时再跑用例只会得到一堆无关的失败。
      - name: 契约测试的 vet
        run: go vet -tags=contract ./internal/assembly/

      - name: 契约测试
        run: |
          set +e
          out=$(go test -tags=contract -count=1 -v ./internal/assembly/ -run Contract 2>&1)
          rc=$?
          set -e
          printf '%s\n' "$out"

          passed=$(printf '%s\n' "$out" | grep -c -- '--- PASS: TestContract' || true)
          if [ "$passed" -eq 0 ]; then
            echo "::error::契约测试一个用例都没跑到：-run Contract 没匹配上，或者用例被跳过了。"
            echo "::error::注意 go test 在 -run 匹配不到任何东西时**照样退出 0**，所以这里不能只看退出码。"
            exit 1
          fi

          if printf '%s\n' "$out" | grep -q -- '--- SKIP'; then
            echo "::error::契约测试有用例被跳过。跳过等于没测。"
            exit 1
          fi

          if [ "$rc" -ne 0 ]; then
            echo "::error::契约测试有失败用例。"
            exit "$rc"
          fi

          echo "契约测试跑了 $passed 个用例，全部通过。"

  redlines:
    name: 公开红线
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 分层自查
        run: bash scripts/check-layering.sh

      # 与其它扫描器同理：判据写反、某个守卫没接上、扫描范围变成空时，
      # 它的输出与「干净」一模一样，所以自测不是可选的
      #（LESSONS.md 第 2、16、23 条）。它只用 bash + coreutils + 一个假的 go。
      - name: 分层自查自测
        run: bash scripts/check-layering.test.sh

      # LESSONS.md 是索引、正文在 lessons/ 下，两者的一致性原先只靠手工验——
      # 而它是本项目反复出现的那种形状：有实现、没有门（LESSONS.md 第 22 条）。
      # 不一致的表现是「索引里点进去是 404」，或者更坏：点进去是**另一条**
      # （编号与文件名脱钩时）。
      #
      # 它只要 bash + coreutils，与分层自查同一类（纯结构检查、不装工具），
      # 所以放在一起，不占 Go job 的时间。
      #
      # 它的成功信号是沉默，所以脚本每次都打印「解析出多少行索引 / 扫到多少个
      # 文件」，两个数有一个是 0 就直接判「没跑成」（退出码 2），而不是报通过
      # （LESSONS.md 第 16 条：检查工具「没跑成」时看起来和「跑成了」一模一样）。
      - name: 索引与正文一致性门禁
        run: bash scripts/check-lessons-index.sh

      # 与其它扫描器同理：判据写反时它的输出与「干净」一模一样，
      # 所以自测不是可选的（LESSONS.md 第 2、16、23 条）。
      - name: 索引与正文一致性门禁自测
        run: bash scripts/check-lessons-index.test.sh

      # docs/ 的两处索引（docs/README.md 的分组表、docs/development.md 顶部的
      # TOC）原先也只靠手工验——与上面那一对同一个形状：有实现、没有门
      #（LESSONS.md 第 22 条），坏掉的样子也相同：点进去是 404，或者更坏——
      # 点进去是别的东西。
      #
      # 它同样只要 bash + coreutils（纯结构检查、不装工具），所以放在一起，
      # 不占 Go job 的时间。
      #
      # 判据三条，都是「能机器判的」那一半：docs/ 下的每份 .md（索引自身
      # 除外）都在索引里被链到；索引里每条指向本目录 .md 的链接都有对应的
      # 文件；development.md 的 TOC 锚点在文中都有对应标题。前两条是一对——
      # 只留一条时另一类错照样漏（新文档没进索引 / 索引里链了一份已经不存在的
      # 文档，两种都是「点进去 404」）。
      #
      # 分组措辞好不好、哪些标题该进 TOC、指向仓库别处的链接有没有写错，不在
      # 它里面——那是人读的取舍，脚本开头的「已知边界」逐条写着。
      #
      # 它的成功信号也是沉默，所以脚本每次都打印七个计数（扫到几份文档 /
      # 索引里几条链接、其中几条指向不存在的文档 / 锚点几个、标题几个）；
      # 除「指向不存在的文档」那一项外，任一个数是 0 就判「没跑成」（退出码 2），
      # 而不是报通过。
      - name: 文档索引与正文一致性门禁
        run: bash scripts/check-docs-index.sh

      # 与其它扫描器同理：判据写反时它的输出与「干净」一模一样，
      # 所以自测不是可选的（LESSONS.md 第 2、16、23 条）。
      - name: 文档索引与正文一致性门禁自测
        run: bash scripts/check-docs-index.test.sh

      # 函数声明的标识符只许用 ASCII：AGENTS.md 写着「代码、标识符、命令、
      # 文件路径、必须保留原文的技术术语保持英文」。
      #
      # 它最初只盯测试函数名：落地时全仓有 75 个 `func Test` 的标识符带中文，
      # 其中 71 个挤在 internal/plugin/sandbox 一个包里——「有约定、没有门」时
      # 约定会自己长（LESSONS 第 22 条）。中文描述不丢，它挪到函数体上方一行注释。
      # 后来判据放宽到**全部 `func` 声明**（普通 / 方法 / 泛型三种形态）：
      # 约定说的是「标识符」，不是「测试函数名」，而留几个已知的中文标识符在
      # 仓库里、门又照不到它们，正是这个项目不接受的那种「悬着」。
      #
      # 判据不能只看退出码。这道门通过时是**沉默**的，而「一个文件都没扫到」
      # 与「干净」在输出里长得一样（LESSONS 第 16 条）。所以这里要它自己给出的
      # 正向证据——扫了多少个文件、找到多少条声明——与上面 deadmethods 那一步
      # 同一个形状。
      - name: 函数名门禁
        run: |
          set +e
          out=$(bash scripts/check-test-names.sh 2>&1)
          rc=$?
          set -e
          printf '%s\n' "$out"

          if ! printf '%s\n' "$out" | grep -qE '^扫描器跑了 [1-9][0-9]* 个 \.go 文件 / [1-9][0-9]* 个 func 声明$'; then
            echo "::error::这道门没有给出「扫了多少」的正向证据，不能当作通过。"
            exit 1
          fi

          if [ "$rc" -ne 0 ]; then
            exit "$rc"
          fi

      # 与其它扫描器同理：判据写反时它的输出与「干净」一模一样，
      # 所以自测不是可选的（LESSONS 第 2、16、23 条）。
      - name: 函数名门禁自测
        run: bash scripts/check-test-names.test.sh

      - name: 扫描器自测
        run: bash scripts/check-redlines.test.sh

      # 变异测试脚本的自测。用桩件、不调真的 gremlins，所以几秒就跑完，
      # 可以在 CI 里每次都跑。它钉的是「什么算没跑成」这类判据——
      # 那些判据错了的时候，脚本的输出与「一切正常」长得一样（见 LESSONS 第 16 条）。
      - name: 变异测试脚本自测
        run: bash scripts/check-mutation.test.sh

      # 文档里的变异基线表是 PKGS 的副本，两份都手维护。集合漂移不会让任何
      # 测试失败：加了包却没补行、表里有行而清单里没包，数字都会安静地停在旧值。
      # 退出码 2 是「没跑成」（表头或 PKGS 段解析不出来），不是「一致」。
      - name: 变异清单与文档表格一致
        run: bash scripts/check-mutation-table.sh

      # 同上：判据写反时它的输出与「一致」一模一样，自测不是可选的。
      - name: 变异清单与文档表格一致的自测
        run: bash scripts/check-mutation-table.test.sh

      # 迁移文件名里的号是写文件那一刻的「next」，合并顺序与它无关：号大的先合入
      # 并部署，已经升过级的库就缺了号小的那条，goose 从此拒绝前进
      # （见 lessons/45-migration-number-merge-order.md）。这里拿 base 树里的最大号
      # 比本分支新增的号，不大于就红；base 解析成空集时退出码 2，不是通过。
      # 本 job 的 checkout 是 fetch-depth: 0，base 的历史与 origin/main 都在。
      - name: 迁移编号顺序
        run: bash scripts/check-migration-order.sh

      # 判据写反、diff 范围写错时它的输出与「没有乱序」一模一样，自测不是可选的。
      - name: 迁移编号顺序自测
        run: bash scripts/check-migration-order.test.sh

      # 脚本用退出码区分「命中」与「自身故障」，这里要把这个区分带出来：
      # 不区分的话，扫描器坏掉的日志和干净通过长得一样，没人会去看。
      - name: 扫描密钥与私有信息
        run: |
          set +e
          bash scripts/check-redlines.sh --all
          rc=$?
          set -e
          if [ "$rc" -eq 2 ]; then
            echo "::error::红线扫描器自身执行失败（退出码 2）。这不是「干净」，是没扫成。"
          fi
          exit "$rc"
