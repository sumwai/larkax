name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    name: Go
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: placeholder
          POSTGRES_DB: larkax_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      LARKAX_DB_DSN: postgres://postgres:placeholder@localhost:5432/larkax_test?sslmode=disable
      LARKAX_ROLE: worker
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: 格式检查
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "以下文件未格式化，请运行 gofmt -w："
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      # 与 gofmt/vet 分工：那两者快且零配置，这里放它们覆盖不到的、
      # 需要跨文件或深入语义的检查。
      #
      # 版本有两个坑，都实际撞过：
      #   1. 用比 go.mod 更旧的 Go 构建的 golangci-lint 会**直接拒绝运行**，
      #      报 "Go language version ... is lower than the targeted Go version"。
      #      所以要用本仓库的 toolchain 现构（install-mode: goinstall）。
      #   2. 它自带的 typechecker 也要够新。v2.5 读不懂 go1.27 的导出数据格式，
      #      报 "export data version 4 is greater than maximum supported
      #      version 2"——那个错看起来像代码问题，其实是工具版本问题。
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.14.0
          install-mode: goinstall

      # 先迁移再跑测试：把库推到已知状态，也让「迁移能应用」这件事
      # 在测试用到它之前就被验证过。
      - name: 迁移可应用且可回滚
        run: |
          go run ./cmd/larkaxctl migrate up
          go run ./cmd/larkaxctl migrate down
          go run ./cmd/larkaxctl migrate up

      - name: 单元测试
        run: go test -race -coverprofile=coverage.out ./...

      - name: 覆盖率摘要
        run: go tool cover -func=coverage.out | tail -1

      # 集成测试在拿不到 DSN 时会**跳过**，而「跳过」在输出里和「通过」
      # 长得一样。这一步让「集成测试真的跑了」可被检查——
      # 否则 CI 会在一个从没跑过集成测试的状态下报绿。
      #
      # 三种「没跑成」要分开报，因为处置完全不同：
      #   编译不过   → 代码问题
      #   被跳过     → DSN 或连接问题
      #   跑了但全不过 → 逻辑问题
      #
      # 用 set -e 会让 `out=$(go test ...)` 在测试失败时直接终止整步，
      # 输出被丢掉、错误信息变成一句「exit code 1」。所以显式接住退出码。
      - name: 确认集成测试确实运行
        run: |
          set +e
          failed=0
          total=0
          for pkg in ./internal/ledger/store/ ./internal/snapshotwire/; do
            out=$(go test -count=1 -v "$pkg" 2>&1)
            rc=$?
            show() { printf '%s\n' "$out" | tail -30; }

            # 一、编译不过或包不存在——那时连测试都没开始跑
            if printf '%s\n' "$out" | grep -q -- 'setup failed\|build failed\|no such file'; then
              echo "::error::$pkg 没能编译，集成测试根本没开始跑"
              show
              failed=1
              continue
            fi

            # 二、被跳过。跳过等于没测，不能算绿
            if printf '%s\n' "$out" | grep -q -- '--- SKIP'; then
              echo "::error::$pkg 的集成测试被跳过了：DSN 没传到，或库连不上。跳过等于没测。"
              printf '%s\n' "$out" | grep -- '--- SKIP'
              failed=1
              continue
            fi

            # 三、一个用例都没跑到
            passed=$(printf '%s\n' "$out" | grep -c -- '--- PASS' || true)
            if [ "$passed" -eq 0 ]; then
              echo "::error::$pkg 的集成测试一个都没跑"
              show
              failed=1
              continue
            fi

            # 四、跑了但有失败
            if [ "$rc" -ne 0 ]; then
              echo "::error::$pkg 的集成测试有失败用例"
              printf '%s\n' "$out" | grep -- '--- FAIL' || show
              failed=1
              continue
            fi

            echo "$pkg 的集成测试跑了 $passed 个用例，全部通过。"
            total=$((total + passed))
          done

          # 汇总一个总数：两个包都「恰好没有集成用例」时，上面的分支
          # 会各自报一次 0 并失败；总数在这里再确认一次，避免漏网的静默状态。
          if [ "$total" -eq 0 ]; then
            echo "::error::一个集成用例都没跑"
            exit 1
          fi
          exit "$failed"

  redlines:
    name: 公开红线
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 分层自查
        run: bash scripts/check-layering.sh

      - name: 扫描器自测
        run: bash scripts/check-redlines.test.sh

      # 变异测试脚本的自测。用桩件、不调真的 gremlins，所以几秒就跑完，
      # 可以在 CI 里每次都跑。它钉的是「什么算没跑成」这类判据——
      # 那些判据错了的时候，脚本的输出与「一切正常」长得一样（见 LESSONS 第 16 条）。
      - name: 变异测试脚本自测
        run: bash scripts/check-mutation.test.sh

      # 脚本用退出码区分「命中」与「自身故障」，这里要把这个区分带出来：
      # 不区分的话，扫描器坏掉的日志和干净通过长得一样，没人会去看。
      - name: 扫描密钥与私有信息
        run: |
          set +e
          bash scripts/check-redlines.sh --all
          rc=$?
          set -e
          if [ "$rc" -eq 2 ]; then
            echo "::error::红线扫描器自身执行失败（退出码 2）。这不是「干净」，是没扫成。"
          fi
          exit "$rc"
