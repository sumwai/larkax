name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    name: Go
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: placeholder
          POSTGRES_DB: larkax_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      LARKAX_DB_DSN: postgres://postgres:placeholder@localhost:5432/larkax_test?sslmode=disable
      LARKAX_ROLE: worker
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: 格式检查
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "以下文件未格式化，请运行 gofmt -w："
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      # 与 gofmt/vet 分工：那两者快且零配置，这里放它们覆盖不到的、
      # 需要跨文件或深入语义的检查（未处理的错误、响应体未关闭、
      # context 没往下传这类）。版本必须与 go.mod 里的 Go 版本兼容——
      # golangci-lint 用比目标更旧的 Go 构建时会直接拒绝运行。
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.5.0

      - name: 单元测试
        run: go test -race -coverprofile=coverage.out ./...

      - name: 覆盖率摘要
        run: go tool cover -func=coverage.out | tail -1

      - name: 迁移可应用且可回滚
        run: |
          go run ./cmd/larkaxctl migrate up
          go run ./cmd/larkaxctl migrate down
          go run ./cmd/larkaxctl migrate up

  redlines:
    name: 公开红线
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 扫描器自测
        run: bash scripts/check-redlines.test.sh

      # 脚本用退出码区分「命中」与「自身故障」，这里要把这个区分带出来：
      # 不区分的话，扫描器坏掉的日志和干净通过长得一样，没人会去看。
      - name: 扫描密钥与私有信息
        run: |
          set +e
          bash scripts/check-redlines.sh --all
          rc=$?
          set -e
          if [ "$rc" -eq 2 ]; then
            echo "::error::红线扫描器自身执行失败（退出码 2）。这不是「干净」，是没扫成。"
          fi
          exit "$rc"
