name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # 门禁清单**不在这里**：它是 .github/workflows/gates.yml，发布路径
  #（release.yml）调的是同一份。这一份工作流只负责「什么时候跑」。
  #
  # 清单留在这一处会怎样，仓库里已经有过一次：`AGENTS.md` 的 Lint 一节与
  # 这里各写一份，漂移只会往「少一道门」的方向积累，而那一侧恰恰是唯一的
  # 执行者（LESSONS.md 第 29 条）。两份工作流之间同理，而且代价更大——
  # 发布路径上少一道门，是「发出去的版本没验过」。
  gates:
    name: 门禁
    uses: ./.github/workflows/gates.yml
