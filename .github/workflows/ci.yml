name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    name: Go
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: placeholder
          POSTGRES_DB: larkax_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      LARKAX_DB_DSN: postgres://postgres:placeholder@localhost:5432/larkax_test?sslmode=disable
      LARKAX_ROLE: worker
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: 格式检查
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "以下文件未格式化，请运行 gofmt -w："
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      # 与 gofmt/vet 分工：那两者快且零配置，这里放它们覆盖不到的、
      # 需要跨文件或深入语义的检查。
      #
      # 版本有两个坑，都实际撞过：
      #   1. 用比 go.mod 更旧的 Go 构建的 golangci-lint 会**直接拒绝运行**，
      #      报 "Go language version ... is lower than the targeted Go version"。
      #      所以要用本仓库的 toolchain 现构（install-mode: goinstall）。
      #   2. 它自带的 typechecker 也要够新。v2.5 读不懂 go1.26 的导出数据格式，
      #      报 "export data version 4 is greater than maximum supported
      #      version 2"——那个错看起来像代码问题，其实是工具版本问题。
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.14.0
          install-mode: goinstall

      # 「新代码没有门」的门禁：从两个 main 包出发跑 deadcode，与签入仓库的
      # 白名单（scripts/deadcode-allowlist.txt）比对。库写完了、测绿了，而
      # 「谁来调它」这件事没有任何一步会失败——`go build`、`go vet`、测试、
      # 覆盖率都不报，于是「有门」与「没门」在 CI 里长得一样。这一道让它失败。
      #
      # 版本必须钉住，且要与 scripts/check-deadcode.sh 里的 PINNED_TOOLS_VERSION
      # 一致：deadcode 的输出随 golang.org/x/tools 的版本变化，工具一升级基线
      # 就不可比（与 gremlins 那次同一个坑）。对不上时脚本会拒绝运行，不会
      # 跑出一批看起来像「新增」的结果。
      #
      # go install 装到 $(go env GOPATH)/bin，那个目录默认不在 PATH 里。
      - name: 安装 deadcode
        run: |
          go install golang.org/x/tools/cmd/deadcode@v0.52.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: 不可达符号门禁
        run: bash scripts/check-deadcode.sh

      # 这道门的判据全是集合比对，坏掉时（一个都没解析出来）的输出和
      # 「全部命中白名单」一模一样。所以自测不是可选的（LESSONS 第 2、16 条）。
      - name: 不可达符号门禁自测
        run: bash scripts/check-deadcode.test.sh

      # 上面那道门的补集。deadcode 只分析**从入口可达的那些包**，一个全仓库
      # 没有任何 import 方的包**整包不在它的分析范围里**——它的不可达清单是空的，
      # 而「空」与「全部可达」在输出里长得一模一样。所以「整包没人接」恰恰是
      # 那道门唯一系统性漏掉的一类，也是「没有门」最严重的一种。
      #
      # 这道门把「仓库自己的包」（go list ./...）与「从入口可达的包」
      #（go list -deps <cmd/ 下自动发现的 main 包>）两个集合相减，差集就是
      # 整包没人 import 的那些，同样走白名单
      #（scripts/unimported-allowlist.txt）：新出现的失败，已经接上的只提示。
      # 只依赖 go，不需要额外装工具。
      - name: 整包没人 import 门禁
        run: bash scripts/check-unimported.sh

      # 与上面那道门同理：它的判据全是集合比对，坏掉时（可达集合为空、
      # 仓库包列表为空）的输出和「通过」一模一样。所以自测不是可选的。
      - name: 整包没人 import 门禁自测
        run: bash scripts/check-unimported.test.sh

      # 前两道门都看不见的一类：**导出方法有没有调用点**。
      # deadcode 底下的 RTA 会把「任何 runtime type 的导出方法」整体当成可达
      # （反射可能调到），于是这一整类都在它的盲区里，而且掩蔽还会沿调用链传下去
      # ——一个被掩蔽的方法如果是某个自由函数唯一的调用方，那个函数也一起消失。
      # 本仓不用反射，所以这一类必须单独有一道门（scripts/check-deadmethods.sh，
      # 只依赖 go，白名单见 scripts/deadmethods-allowlist.txt）。
      - name: 导出方法调用点门禁
        run: |
          set +e
          out=$(bash scripts/check-deadmethods.sh 2>&1)
          rc=$?
          set -e
          printf '%s\n' "$out"

          # 这道门通过时是**沉默**的，而「什么都没输出」与「什么都没检查」长得一样。
          # 判据是它自己打出的正向证据：扫了几个文件、比了多少条。
          # 只看退出码不够——扫描范围变成零个包时它照样会走到「全部命中白名单」。
          if ! printf '%s\n' "$out" | grep -qE '^扫描器跑了 [1-9][0-9]* 个文件 / [1-9][0-9]* 个导出方法声明'; then
            echo "::error::这道门没有给出「扫了多少」的正向证据，不能当作通过。"
            exit 1
          fi
          if ! printf '%s\n' "$out" | grep -qE '^白名单 .* —— [1-9][0-9]* 条 / 上限 [0-9]+$'; then
            echo "::error::白名单一条都没读进来，比对的是半份清单。"
            exit 1
          fi

          if [ "$rc" -ne 0 ]; then
            exit "$rc"
          fi

      # 这道门的判据一半在脚本里、一半在脚本内嵌的那份 AST 扫描器里，
      # 而**两半坏掉时都不会响**：一个符号都扫不出来时屏幕上就是
      # 「全部命中白名单」。所以自测不是可选的（LESSONS 第 2、16、23 条）。
      - name: 导出方法调用点门禁自测
        run: bash scripts/check-deadmethods.test.sh

      # 先迁移再跑测试：把库推到已知状态，也让「迁移能应用」这件事
      # 在测试用到它之前就被验证过。
      - name: 迁移可应用且可回滚
        run: |
          go run ./cmd/larkaxctl migrate up
          go run ./cmd/larkaxctl migrate down
          go run ./cmd/larkaxctl migrate up

      - name: 单元测试
        run: go test -race -coverprofile=coverage.out ./...

      - name: 覆盖率摘要
        run: go tool cover -func=coverage.out | tail -1

      # 集成测试在拿不到 DSN 时会**跳过**，而「跳过」在输出里和「通过」
      # 长得一样。这一步让「集成测试真的跑了」可被检查——
      # 否则 CI 会在一个从没跑过集成测试的状态下报绿。
      #
      # 检查本身在 .github/actions/check-integration-tests：release 也调它，
      # 于是这个门禁只有一份实现，两边不会各自漂移。
      - uses: ./.github/actions/check-integration-tests

  # 契约测试：用**官方 SDK** 当客户端跑一遍，两套协议各一遍。
  #
  # 与 go job 分开，是因为它多两个运行期依赖（Python 与两个官方 SDK）。
  # 塞进 go job 会让「Go 测试挂了」与「Python 依赖没装」混在同一份日志里，
  # 而这两件事的处置完全不同。
  #
  # 它验的是**我们对外响应的形状**——必填字段、可空字段是 null 还是省略、
  # finish_reason 的取值集合、流式事件的顺序与终止条件、错误体的 error.type。
  # 这几种错，仓库里的端到端用例全绿，而客户端一接就崩：那些用例用的是自己
  # 写的假上游与自己构造的请求，证明的只是「我们的响应我们自己能解析」。
  contract:
    name: 契约
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: placeholder
          POSTGRES_DB: larkax_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      LARKAX_DB_DSN: postgres://postgres:placeholder@localhost:5432/larkax_test?sslmode=disable
      LARKAX_ROLE: worker
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 版本钉在 contract/requirements.txt 里（`==`，不是 `>=`）。
      # 理由与 gremlins / deadcode 那两次一样：不钉版本的工具，它的结论不可比——
      # SDK 一个大版本升级会改响应形状的解析，那时「昨天绿今天红」说明不了任何事。
      - name: 安装契约测试依赖
        run: pip install -r contract/requirements.txt

      # 判据不能只看退出码。`-run` 匹配不到任何用例时 `go test` **照样退出 0**，
      # 输出里只有一行 "testing: warning: no tests to run"——那与「全跑过了」
      # 在退出码上长得一模一样（见 LESSONS.md 第 16 条）。
      #
      # 所以这里要一个**正向证据**：`--- PASS: TestContract...` 出现过几次。
      # 这与 .github/actions/check-integration-tests 那道门是同一个形状，
      # 只是它按包数、这里按用例数。
      # `go vet` 默认**不看** build tag 后面的文件，所以带 `contract` 标签的那一份
      # 在 `go` job 的 `go vet ./...` 里是看不见的——它要单独带 `-tags` 跑一遍
      # （AGENTS.md 的 Lint 一节写着这条命令）。放在契约测试**之前**：vet 挂了
      # 说明这一份根本没编译过，那时再跑用例只会得到一堆无关的失败。
      - name: 契约测试的 vet
        run: go vet -tags=contract ./internal/assembly/

      - name: 契约测试
        run: |
          set +e
          out=$(go test -tags=contract -count=1 -v ./internal/assembly/ -run Contract 2>&1)
          rc=$?
          set -e
          printf '%s\n' "$out"

          passed=$(printf '%s\n' "$out" | grep -c -- '--- PASS: TestContract' || true)
          if [ "$passed" -eq 0 ]; then
            echo "::error::契约测试一个用例都没跑到：-run Contract 没匹配上，或者用例被跳过了。"
            echo "::error::注意 go test 在 -run 匹配不到任何东西时**照样退出 0**，所以这里不能只看退出码。"
            exit 1
          fi

          if printf '%s\n' "$out" | grep -q -- '--- SKIP'; then
            echo "::error::契约测试有用例被跳过。跳过等于没测。"
            exit 1
          fi

          if [ "$rc" -ne 0 ]; then
            echo "::error::契约测试有失败用例。"
            exit "$rc"
          fi

          echo "契约测试跑了 $passed 个用例，全部通过。"

  redlines:
    name: 公开红线
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 分层自查
        run: bash scripts/check-layering.sh

      # 函数声明的标识符只许用 ASCII：AGENTS.md 写着「代码、标识符、命令、
      # 文件路径、必须保留原文的技术术语保持英文」。
      #
      # 它最初只盯测试函数名：落地时全仓有 75 个 `func Test` 的标识符带中文，
      # 其中 71 个挤在 internal/plugin/sandbox 一个包里——「有约定、没有门」时
      # 约定会自己长（LESSONS 第 22 条）。中文描述不丢，它挪到函数体上方一行注释。
      # 后来判据放宽到**全部 `func` 声明**（普通 / 方法 / 泛型三种形态）：
      # 约定说的是「标识符」，不是「测试函数名」，而留几个已知的中文标识符在
      # 仓库里、门又照不到它们，正是这个项目不接受的那种「悬着」。
      #
      # 判据不能只看退出码。这道门通过时是**沉默**的，而「一个文件都没扫到」
      # 与「干净」在输出里长得一样（LESSONS 第 16 条）。所以这里要它自己给出的
      # 正向证据——扫了多少个文件、找到多少条声明——与上面 deadmethods 那一步
      # 同一个形状。
      - name: 函数名门禁
        run: |
          set +e
          out=$(bash scripts/check-test-names.sh 2>&1)
          rc=$?
          set -e
          printf '%s\n' "$out"

          if ! printf '%s\n' "$out" | grep -qE '^扫描器跑了 [1-9][0-9]* 个 \.go 文件 / [1-9][0-9]* 个 func 声明$'; then
            echo "::error::这道门没有给出「扫了多少」的正向证据，不能当作通过。"
            exit 1
          fi

          if [ "$rc" -ne 0 ]; then
            exit "$rc"
          fi

      # 与其它扫描器同理：判据写反时它的输出与「干净」一模一样，
      # 所以自测不是可选的（LESSONS 第 2、16、23 条）。
      - name: 函数名门禁自测
        run: bash scripts/check-test-names.test.sh

      - name: 扫描器自测
        run: bash scripts/check-redlines.test.sh

      # 变异测试脚本的自测。用桩件、不调真的 gremlins，所以几秒就跑完，
      # 可以在 CI 里每次都跑。它钉的是「什么算没跑成」这类判据——
      # 那些判据错了的时候，脚本的输出与「一切正常」长得一样（见 LESSONS 第 16 条）。
      - name: 变异测试脚本自测
        run: bash scripts/check-mutation.test.sh

      # 脚本用退出码区分「命中」与「自身故障」，这里要把这个区分带出来：
      # 不区分的话，扫描器坏掉的日志和干净通过长得一样，没人会去看。
      - name: 扫描密钥与私有信息
        run: |
          set +e
          bash scripts/check-redlines.sh --all
          rc=$?
          set -e
          if [ "$rc" -eq 2 ]; then
            echo "::error::红线扫描器自身执行失败（退出码 2）。这不是「干净」，是没扫成。"
          fi
          exit "$rc"
