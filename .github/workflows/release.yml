name: Release

# 只在 tag 上触发。发布是一件需要人明确决定的事——
# 不能让「合进 main」自动等于「发一个版本」。
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  # 发布前的最后一道门。tag 可能打在没跑过 CI 的 commit 上
  #（例如从别的分支合的、或本地直接推的 tag），所以这里重跑一遍。
  #
  # 重跑的是**与 ci.yml 同一份工作流**（.github/workflows/gates.yml），
  # 而不是把那些步骤在这里再列一遍。列一遍的写法原先就在这个文件里，代价是：
  # 这里只有 `go test` 与集成测试门禁，`gofmt`、`go vet`、`golangci-lint`、
  # 分层自查、红线扫描、三道死代码门、函数名门禁、索引一致性门禁、契约测试
  # 一道都没跑——这道门比常规 CI **弱**，而它是唯一挡在发布前面的一道。
  # 再列一遍也不会自己变好：`ci.yml` 日后多一道门，这里不会跟着多，
  # 而「少跑了一道」与「全都跑过了」在日志里长得一样（LESSONS.md 第 16 条）。
  #
  # 引用是同一仓库内的相对路径（`./.github/workflows/...`），取的是**调用方
  # 那个 commit** 里的那一份：tag 触发时就是 tag 指向的 commit，所以发布验的
  # 正是要发出去的那棵树，而不是 main 上的某一版。
  gates:
    name: 门禁
    uses: ./.github/workflows/gates.yml

  release:
    name: 构建并发布
    runs-on: ubuntu-latest
    # 门禁挂了，这个 job 根本不启动——不是「先构建再发现门禁是红的」。
    # 也正因为测试在 gates 里跑，这里的日志只剩构建与发布，
    # 「门禁挂了」与「构建挂了」不会混在同一份输出里（ci.yml 把 Go 与契约
    # 拆成两个 job 也是这个理由）。
    needs: gates
    steps:
      - uses: actions/checkout@v4
        with:
          # 生成 release notes 要读 tag 之间的提交历史
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # 版本号只有一处来源：tag。代码里不写死，构建时注入。
      # 两个二进制注入同一个变量名，它们的版本必须能对上。
      - name: 构建
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          mkdir -p dist
          for pair in "larkax:./cmd/larkax" "larkaxctl:./cmd/larkaxctl"; do
            name="${pair%%:*}"
            pkg="${pair#*:}"
            for arch in amd64 arm64; do
              GOOS=linux GOARCH="$arch" CGO_ENABLED=0 \
                go build -trimpath \
                  -ldflags "-s -w -X main.version=$VERSION" \
                  -o "dist/${name}_linux_${arch}" "$pkg"
            done
          done
          # 校验注入成功：漏了这一步，发布出去的二进制会自称 dev，
          # 而这只有在用户报问题时才会被发现
          if ! ./dist/larkax_linux_amd64 --version | grep -qx "$VERSION"; then
            echo "::error::版本注入失败，二进制自称 $(./dist/larkax_linux_amd64 --version)"
            exit 1
          fi

      # 打包：发出去的是 tarball，除了两个二进制还有 LICENSE、README.md 与
      # man/man1/ 下的手页。手页是**用户面文档**的一部分：只存在于源码树里的话，
      # 装了发布版的人 `man larkaxctl-channel` 翻不到，而那时他多半以为是自己
      # 没装对。
      #
      # 打的是仓库里**已提交**的那一份（`man/man1/*.1`），不在这里跑生成器：手页
      # 是产物，它与两份源文件是否同一次生成由 scripts/check-man-pages.sh 保证
      # （见 docs/development.md）。发布时再生成一次，等于给要发出去的那一包多加
      # 一个变量，而这一次生成后面没有第二道门——错了就直接发出去。
      - name: 打包
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          for arch in amd64 arm64; do
            stage="$(mktemp -d)"
            cp "dist/larkax_linux_${arch}" "$stage/larkax"
            cp "dist/larkaxctl_linux_${arch}" "$stage/larkaxctl"
            chmod 0755 "$stage/larkax" "$stage/larkaxctl"
            cp LICENSE README.md "$stage/"
            mkdir -p "$stage/man/man1"
            cp man/man1/*.1 "$stage/man/man1/"
            # 条目顺序与属主固定下来：tar 默认按目录顺序写、并带上构建机的
            # uid/gid（runner 上是 1001），两样都让同一个包随环境变。
            tar -czf "dist/larkax_${VERSION}_linux_${arch}.tar.gz" \
              --sort=name --owner=0 --group=0 --numeric-owner \
              -C "$stage" .
            rm -rf "$stage"
          done
          # 裸二进制到此为止：发布物只有 tarball。两份产物等于两条安装故事，而
          # SHA256SUMS 只盖得住一条——「有校验和的那个」与「用户脚本里可能正在
          # curl 的那个」不是同一个东西时，校验和就成了摆设。
          #
          # 通配只命中 larkax_linux_<架构> 与 larkaxctl_linux_<架构>：tarball 叫
          # larkax_<版本>_linux_<架构>.tar.gz，前缀不是这两个。
          rm -f dist/larkax_linux_* dist/larkaxctl_linux_*

      # 校验和算的是 tarball：它是用户下载之后要核对的那一份。
      - name: 校验和
        working-directory: dist
        run: sha256sum *.tar.gz > SHA256SUMS

      - name: 发布
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes \
            dist/*
