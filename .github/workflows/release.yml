name: Release

# 只在 tag 上触发。发布是一件需要人明确决定的事——
# 不能让「合进 main」自动等于「发一个版本」。
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  # 发布前的最后一道门。tag 可能打在没跑过 CI 的 commit 上
  #（例如从别的分支合的、或本地直接推的 tag），所以这里重跑一遍。
  #
  # 重跑的是**与 ci.yml 同一份工作流**（.github/workflows/gates.yml），
  # 而不是把那些步骤在这里再列一遍。列一遍的写法原先就在这个文件里，代价是：
  # 这里只有 `go test` 与集成测试门禁，`gofmt`、`go vet`、`golangci-lint`、
  # 分层自查、红线扫描、三道死代码门、函数名门禁、索引一致性门禁、契约测试
  # 一道都没跑——这道门比常规 CI **弱**，而它是唯一挡在发布前面的一道。
  # 再列一遍也不会自己变好：`ci.yml` 日后多一道门，这里不会跟着多，
  # 而「少跑了一道」与「全都跑过了」在日志里长得一样（LESSONS.md 第 16 条）。
  #
  # 引用是同一仓库内的相对路径（`./.github/workflows/...`），取的是**调用方
  # 那个 commit** 里的那一份：tag 触发时就是 tag 指向的 commit，所以发布验的
  # 正是要发出去的那棵树，而不是 main 上的某一版。
  gates:
    name: 门禁
    uses: ./.github/workflows/gates.yml

  release:
    name: 构建并发布
    runs-on: ubuntu-latest
    # 门禁挂了，这个 job 根本不启动——不是「先构建再发现门禁是红的」。
    # 也正因为测试在 gates 里跑，这里的日志只剩构建与发布，
    # 「门禁挂了」与「构建挂了」不会混在同一份输出里（ci.yml 把 Go 与契约
    # 拆成两个 job 也是这个理由）。
    needs: gates
    steps:
      - uses: actions/checkout@v4
        with:
          # 生成 release notes 要读 tag 之间的提交历史
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # 构建、打包、算校验和是**一条配方**，写在 Makefile 的 `dist` 目标里。
      # 这里只调它，不把这些步骤再列一遍——列一遍就是第二份，改一处要记得改
      # 另一处，而漂移之后没有任何门禁会响（LESSONS.md 第 16 条：少做了一步
      # 与全做过了，在日志里长得一样）。
      #
      # ARCHS 两个架构都给：CI 跑在 linux/amd64 上，于是 amd64 会被真执行一次，
      # 校验版本注入确实进去了；arm64 执行不起来，会打印一句「跳过执行校验
      # （架构不同）」。后者是预期内的，而那行字是故意打出来的。
      #
      # 版本号只有一处来源：tag。代码里不写死，构建时注入；两个二进制注入同一个
      # 变量名，它们的版本必须能对上。
      - name: 构建并打包
        env:
          VERSION: ${{ github.ref_name }}
        run: make dist VERSION="$VERSION" ARCHS="amd64 arm64"

      - name: 发布
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes \
            dist/*
